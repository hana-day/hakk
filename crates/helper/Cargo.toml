[package]
name = "hakk-helper"
description = "The helper: runs scans over the read layer and serves the GUI's requests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blocksource = { path = "../blocksource" }
carver = { path = "../carver" }
crossbeam-channel = "0.5.17"
serde = "1.0.229"
serde_json = "1.0.151"
hakk-protocol = { path = "../protocol" }
index = { path = "../index" }
scan = { path = "../scan" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3"

[lints]
workspace = true
