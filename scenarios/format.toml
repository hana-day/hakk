# Quick format: write files, quick-format the volume, then write a few more.
name = "format"
seed = 2
size = "64MiB"
fs = "exfat"

[[steps]]
op = "write"
kind = "jpeg"
count = 40
min_size = "200KiB"
max_size = "1MiB"

[[steps]]
op = "format"

[[steps]]
op = "write"
kind = "jpeg"
count = 5
min_size = "200KiB"
max_size = "1MiB"
