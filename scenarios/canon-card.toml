# Canon card: a 32 MB SD card formatted like a Canon PowerShot (FAT12, 16 KiB clusters,
# one MBR partition at sector 51 so the data area starts on a 16 KiB boundary), shot,
# partly erased in the camera, and shot again. Modeled on the NPS nps-2009-canon2 images.
name = "canon-card"
seed = 6
size = "32MiB"
fs = "fat12"
cluster = "16KiB"
partition_start = 51
partition_type = 0x04

[[steps]]
op = "write"
kind = "jpeg"
profile = "canon-compact"
count = 20
min_size = "600KiB"
max_size = "1MiB"

[[steps]]
op = "delete"
fraction = 0.4

[[steps]]
op = "write"
kind = "jpeg"
profile = "canon-compact"
count = 8
min_size = "700KiB"
max_size = "1400KiB"

[[steps]]
op = "delete"
fraction = 0.3
