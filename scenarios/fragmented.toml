# Fragmented: write files onto a disk full of holes (so they fragment), then delete them.
name = "fragmented"
seed = 3
size = "64MiB"
fs = "exfat"

[[steps]]
op = "write"
kind = "jpeg"
count = 50
min_size = "100KiB"
max_size = "600KiB"

[[steps]]
op = "delete"
fraction = 0.5

# Files larger than the holes get split across several of them.
[[steps]]
op = "write"
kind = "jpeg"
count = 8
min_size = "800KiB"
max_size = "1500KiB"
dir = "DCIM/101HAKK"

[[steps]]
op = "write"
kind = "mp4"
count = 2
min_size = "1MiB"
max_size = "3MiB"
dir = "DCIM/101HAKK"

[[steps]]
op = "delete"
fraction = 0.6
dir = "DCIM/101HAKK"
