# Basic: write photos and videos, delete half, then write a few more.
# macOS's exFAT driver reuses free space from the front, so some deleted files get
# overwritten and the new files fragment to fill the gaps.
name = "basic"
seed = 1
size = "64MiB"
fs = "exfat"

[[steps]]
op = "write"
kind = "jpeg"
count = 30
min_size = "200KiB"
max_size = "1MiB"

[[steps]]
op = "write"
kind = "mp4"
count = 3
min_size = "2MiB"
max_size = "6MiB"
dir = "DCIM/101HAKK"

[[steps]]
op = "delete"
fraction = 0.5

[[steps]]
op = "write"
kind = "jpeg"
count = 6
min_size = "300KiB"
max_size = "1MiB"
