[package]
name = "hakk-scenario"
description = "Scenario generator: builds disk images with deleted files and a ground-truth manifest from a seed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.8"
