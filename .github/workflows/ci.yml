name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt / clippy / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain from rust-toolchain.toml automatically.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Physical disk path: attach an image as a raw device and read it with the
      # production Device code (hdiutil on macOS, a loop device on Linux, a VHD on Windows).
      - if: runner.os == 'macOS'
        run: cargo test -p blocksource --test device_macos -- --ignored
      - if: runner.os == 'Linux'
        run: cargo test -p blocksource --test device_linux -- --ignored
      - if: runner.os == 'Windows'
        run: cargo test -p blocksource --test device_windows -- --ignored

  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The runner kernel lacks the exFAT driver by default; load it from the extra modules.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs "linux-modules-extra-$(uname -r)"
          sudo modprobe exfat
      - if: runner.os == 'macOS'
        run: brew install testdisk
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y testdisk
      # PhotoRec is skipped on Windows (no package on the runner).
      # Generate images from scenarios, recover with the naive carver and PhotoRec, and score.
      - run: cargo xtask bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: |
            work/bench/summary.json
            work/bench/*/manifest.json
            work/bench/*/*.json
