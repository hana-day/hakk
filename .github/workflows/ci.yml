name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt / clippy / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml に従って rustup が自動でツールチェーンを入れる
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # 物理ディスク経路：hdiutil でイメージを生デバイスとして接続して読む
      - if: runner.os == 'macOS'
        run: cargo test -p blocksource --test device_macos -- --ignored

  scenario:
    name: scenario (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - run: cargo build -p hakk-scenario --release
      - name: シナリオからイメージと正解マニフェストを生成
        shell: bash
        run: |
          for s in scenarios/*.toml; do
            ./target/release/hakk-scenario "$s" "work/$(basename "$s" .toml)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ matrix.os }}
          path: work/*/manifest.json
