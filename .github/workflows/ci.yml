name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt / clippy / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml に従って rustup が自動でツールチェーンを入れる
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # 物理ディスク経路：hdiutil でイメージを生デバイスとして接続して読む
      - if: runner.os == 'macOS'
        run: cargo test -p blocksource --test device_macos -- --ignored

  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # ランナーのカーネルには exFAT ドライバが標準で入っていないので、追加モジュールから読み込む
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs "linux-modules-extra-$(uname -r)"
          sudo modprobe exfat
      - if: runner.os == 'macOS'
        run: brew install testdisk
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y testdisk
      # シナリオからイメージを生成し、自作の最小カーバーと PhotoRec で復元して採点する
      - run: cargo xtask bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: |
            work/bench/summary.json
            work/bench/*/manifest.json
            work/bench/*/*.json
