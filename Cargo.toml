[workspace]
resolver = "3"
members = ["crates/blocksource", "crates/carver", "crates/fs", "crates/protocol", "crates/app", "tools/scenario", "tools/eval", "tools/xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
# License undecided (all rights reserved). Do not set `license` until it is decided.
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
