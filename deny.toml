# cargo-deny configuration. Keeps GPL-family licenses out of the dependency tree.
[graph]
all-features = true

[licenses]
# Allowlist: any license not listed fails (GPL/LGPL/AGPL/MPL are deliberately absent).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates (publish = false) have no license field and are not checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within the workspace (publish = false) are not treated as wildcards.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
