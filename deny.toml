# cargo-deny configuration. Keeps GPL-family licenses out of the dependency tree.
[graph]
all-features = true

[licenses]
# Allowlist: any license not listed fails (GPL/LGPL/AGPL/MPL are deliberately absent).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

# Crate-specific exceptions. Each one is pulled in by Tauri and cannot be removed.
# MPL-2.0 is file-level copyleft: obligations apply only to these crates' own files.
exceptions = [
    # tauri-utils / wry -> dom_query (HTML parsing for CSP injection)
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    # tauri -> dirs -> dirs-sys
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Development tool only (tools/scenario, never shipped): a JPEG encoder that can write
    # restart markers. The IJG license is permissive (attribution in distributed software).
    { allow = ["IJG"], crate = "jpeg-encoder" },
]

[licenses.private]
# Our own crates (publish = false) have no license field and are not checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within the workspace (publish = false) are not treated as wildcards.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained. Pulled in on Linux by Tauri's GTK bindings
    # (gtk-rs 0.18 via muda); it is a build-time proc macro only.
    { id = "RUSTSEC-2024-0370", reason = "Tauri's GTK dependency; no maintained alternative in Tauri 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
